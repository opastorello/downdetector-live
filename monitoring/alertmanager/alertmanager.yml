global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'company', 'country']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'

receivers:
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}
          *Status:* {{ .Status }}
          *Serviço:* {{ .Labels.company }} ({{ .Labels.country }})
          *Descrição:* {{ .Annotations.description }}
          {{ end }}
        actions:
          - type: button
            text: 'Ver no Grafana'
            url: 'http://localhost:3000/d/downdetector-main'

  - name: 'critical'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🚨 CRÍTICO{{ else }}✅ Resolvido{{ end }} - {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}
          *Serviço:* {{ .Labels.company }} ({{ .Labels.country }})
          *Descrição:* {{ .Annotations.description }}
          *Início:* {{ .StartsAt.Format "02/01/2006 15:04" }}
          {{ if eq .Status "resolved" }}*Fim:* {{ .EndsAt.Format "02/01/2006 15:04" }}{{ end }}
          {{ end }}
    webhook_configs:
      - url: '${GCHAT_WEBHOOK_URL}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'company']

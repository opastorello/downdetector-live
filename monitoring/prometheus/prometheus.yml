global:
  scrape_interval: 60s
  evaluation_interval: 60s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: downdetector
    scrape_timeout: 45s
    static_configs:
      - targets: ["exporter:9693"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
